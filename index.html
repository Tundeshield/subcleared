<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SubCleared — know which subcontractors are ready to work, what's missing and what needs attention." />
    <meta name="theme-color" content="#0b0d0f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>SubCleared — Subcontractor compliance and readiness</title>
    <script>
      try { var p = JSON.parse(localStorage.getItem('sc.prefs') || '{}'); var t = p.theme || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t; document.documentElement.style.fontSize = (16 * (p.textScale || 1)) + 'px'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
