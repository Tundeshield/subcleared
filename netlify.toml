[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "stripe"]
  # The extraction test set travels with the functions so accuracy can be measured against the production model.
  included_files = ["tests/fixtures/certificates/**"]

# A missing build file must be a 404, not the app's HTML (which the browser would
# otherwise try to run as JavaScript and cache for a year under /assets/*).
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA routing (API routes are declared in each function's config.path)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://storage.googleapis.com https://*.firebasestorage.app; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://storage.googleapis.com https://*.firebasestorage.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'self' https://storage.googleapis.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/portal/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
